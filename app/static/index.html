<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Folio 译坊 — 由 mini-harness 驱动的 AI 书籍翻译平台">
  <title>Folio 译坊 · AI 书籍翻译</title>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2327231f%22/><path d=%22M28 24h44v8H36v14h30v8H36v22h36v8H28z%22 fill=%22%23f2e8d5%22/><path d=%22M68 54l12 12-12 12z%22 fill=%22%23b24a2f%22/></svg>">
</head>
<body>
  <div id="grain" aria-hidden="true"></div>

  <!-- ======================= AUTH ======================= -->
  <section id="auth-view" class="auth-shell hidden">
    <div class="auth-left">
      <div class="auth-brand">
        <span class="brand-mark">F</span>
        <span>Folio 译坊</span>
      </div>
      <div class="auth-quote">
        <div class="quote-glyph">“</div>
        <p>每一本书，都值得被另一种语言重新点亮。</p>
        <span>AI 负责翻译，人负责选择。</span>
      </div>
      <div class="shelf-art" aria-hidden="true">
        <div class="shelf-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="shelf-row"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="shelf-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <p class="auth-foot">mini-harness × DeepSeek · 逐段保存 · 中断可续</p>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-auth-tab="login">登录</button>
          <button class="auth-tab" data-auth-tab="register">创建账户</button>
        </div>
        <form id="login-form" class="auth-form">
          <h2>欢迎回来</h2>
          <p class="muted">继续你的翻译书架。</p>
          <label>邮箱<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="至少 8 位" required></label>
          <button class="btn btn-primary btn-wide" type="submit">登录</button>
          <button class="btn btn-ghost btn-wide" type="button" id="demo-login">使用演示账户进入</button>
          <p class="tiny muted">演示账户：demo@folio.local / folio2026</p>
        </form>
        <form id="register-form" class="auth-form hidden">
          <h2>创建账户</h2>
          <p class="muted">你的文档只在你的书架中可见。</p>
          <label>称呼<input name="name" type="text" autocomplete="name" placeholder="如何称呼你" required></label>
          <label>邮箱<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
          <label>密码<input name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" minlength="8" required></label>
          <button class="btn btn-primary btn-wide" type="submit">创建并登录</button>
        </form>
        <p class="auth-note">由 mini-harness 提供翻译算力 · 不在本地保存模型密钥</p>
      </div>
    </div>
  </section>

  <!-- ======================= APP ======================= -->
  <div id="app-view" class="app-shell hidden">
    <aside class="sidebar">
      <a class="brand" href="#/library">
        <span class="brand-mark">F</span>
        <span class="brand-word">Folio<em>译坊</em></span>
      </a>
      <nav class="nav" id="main-nav">
        <a href="#/library" data-nav="library"><span class="nav-icon">▤</span><span>我的书架</span></a>
        <a href="#/new" data-nav="new"><span class="nav-icon">＋</span><span>导入新书</span></a>
        <a href="#/reference" data-nav="reference"><span class="nav-icon">✦</span><span>参考书目</span><span class="nav-badge" id="library-badge"></span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="harness-status" id="harness-status">
          <span class="status-dot pending"></span>
          <div><strong>翻译引擎</strong><span>检查中…</span></div>
        </div>
        <div class="user-chip">
          <span class="avatar" id="user-avatar">读</span>
          <div class="user-meta"><strong id="user-name">读者</strong><span id="user-email"></span></div>
          <button class="icon-btn" id="logout-btn" title="退出登录">↪</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobile-menu" aria-label="菜单">☰</button>
        <div class="crumbs" id="crumbs"><span>我的书架</span></div>
        <div class="top-actions">
          <span class="engine-pill" id="engine-pill"><span class="status-dot pending"></span><span>AI 引擎</span></span>
          <a class="btn btn-small btn-primary" href="#/new">＋ 导入新书</a>
        </div>
      </header>
      <div id="page" class="page"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/vendor/katex/auto-render.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
