[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-translator"
version = "1.0.0"
description = "AI book translation platform powered by mini-harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "latex2mathml>=3.77",
    "mathml2omml>=0.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
folio = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "static/*.html", "static/*.css", "static/*.js",
    "static/fonts/*.otf", "static/vendor/katex/*", "static/vendor/katex/fonts/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
ignore = ["B008", "S110", "S112", "TRY004", "PYI034", "SIM103", "SIM114", "BLE001"]
